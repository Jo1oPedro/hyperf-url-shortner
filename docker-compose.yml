services:
  app:
    container_name: hyperf-url-shortner
    build:
      dockerfile: dev.Dockerfile
      args:
        UID: 1000
        GID: 1000
    volumes:
      - ./:/opt/www
    ports:
      - "9501:9501"
    environment:
      APP_ENV: dev
      SCAN_CACHEABLE: "false"
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-hyperf_url_shortner}
      DB_USERNAME: ${DB_USERNAME:-hyperf}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: hyperf-url-shortener
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_PHP_TRACES_PROCESSOR: simple
      OTEL_LOG_LEVEL: debug
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - hyperf-network

  mysql:
    image: mysql:8.0
    container_name: hyperf-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hyperf_url_shortner}
      MYSQL_USER: ${DB_USERNAME:-hyperf}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-network

  redis:
    image: redis:7-alpine
    container_name: hyperf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: hyperf-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - hyperf-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: hyperf-kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - hyperf-network

  prometheus:
    image: prom/prometheus:latest
    container_name: hyperf-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    networks:
      - hyperf-network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: hyperf-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - hyperf-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: hyperf-otel-collector
    command: [ "--config=/etc/otelcol/config.yml" ]
    volumes:
      - ./docker/otel/collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4318:4318"
      - "4317:4317"
    depends_on:
      - jaeger
    networks:
      - hyperf-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hyperf-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - hyperf-network

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  zookeeper-logs:
  grafana-data:

networks:
  hyperf-network:
    name: hyperf-network
